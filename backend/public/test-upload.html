<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { max-width: 500px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; }
        input, button { padding: 8px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        .error { border-color: #dc3545; background: #f8d7da; }
        .success { border-color: #28a745; background: #d4edda; }
    </style>
</head>
<body>
    <h1>Test Image Upload</h1>
    
    <form id="uploadForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="photo">Select Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
        </div>
        
        <div class="form-group">
            <button type="submit">Upload Test Photo</button>
        </div>
    </form>
    
    <div id="result" class="result" style="display: none;">
        <h3>Result:</h3>
        <pre id="resultContent"></pre>
    </div>
    
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const photoFile = document.getElementById('photo').files[0];
            
            if (!photoFile) {
                alert('Please select a photo');
                return;
            }
            
            formData.append('photo', photoFile);
            
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            try {
                console.log('Uploading to:', 'http://10.98.151.57:5000/api/lost-found/test-upload');
                const response = await fetch('http://10.98.151.57:5000/api/lost-found/test-upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                resultDiv.style.display = 'block';
                resultDiv.className = response.ok ? 'result success' : 'result error';
                resultContent.textContent = JSON.stringify(result, null, 2);
                
                if (result.success && result.file.url) {
                    const img = document.createElement('img');
                    img.src = 'http://10.98.151.57:5000' + result.file.url;
                    img.style.maxWidth = '300px';
                    img.style.marginTop = '10px';
                    resultDiv.appendChild(img);
                }
                
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultContent.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
