<!DOCTYPE html>
<html>
<head>
    <title>BusHubLK - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { background-color: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: 50px auto; }
        .logo { font-size: 4em; margin-bottom: 10px; }
        .title { font-size: 1.8em; color: #1e3a8a; margin-bottom: 20px; }
        .message.error { color: #dc3545; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        .button {
            display: block; width: 100%; padding: 12px 20px;
            background-color: #3b82f6; color: white; text-decoration: none;
            border-radius: 8px; font-size: 1.1em; border: none; cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button:hover { background-color: #2563eb; }
        .requirements {
            background-color: #e6f7ff;
            border: 1px solid #91d5ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.9em;
            color: #333;
        }
        .requirements ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .requirements li {
            margin-bottom: 5px;
        }
        .requirements li::before {
            content: "• ";
            color: #3b82f6;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚌</div>
        <h1 class="title">BusHubLK</h1>
        <h2>Reset Your Password</h2>

        <div id="errorMessage" class="message error" style="display:none;"></div>

        <div class="requirements">
            <h3>Password Requirements:</h3>
            <ul>
                <li>At least 6 characters long</li>
                <li>One uppercase letter</li>
                <li>One lowercase letter</li>
                <li>One number</li>
            </ul>
        </div>

        <form id="resetPasswordForm" action="/api/password-reset/reset" method="POST">
            <input type="hidden" id="token" name="token">
            <input type="hidden" id="email" name="email">

            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit" class="button" id="submitButton">Reset Password</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');
            const errorMessageDiv = document.getElementById('errorMessage');
            const submitButton = document.getElementById('submitButton');
            const resetPasswordForm = document.getElementById('resetPasswordForm');

            if (!token || !email) {
                errorMessageDiv.textContent = 'Error: Missing reset token or email in URL. Please use the full link from your email.';
                errorMessageDiv.style.display = 'block';
                // Optionally disable the form
                resetPasswordForm.style.display = 'none'; // Hide the form if params are missing
                return;
            }

            // Populate the hidden fields with values from the URL
            document.getElementById('token').value = token;
            document.getElementById('email').value = email;

            // Add an event listener for form submission
            resetPasswordForm.addEventListener('submit', function(event) {
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                let errors = [];

                if (newPassword !== confirmPassword) {
                    errors.push("Passwords do not match.");
                }
                if (newPassword.length < 6) {
                    errors.push("Password must be at least 6 characters long.");
                }
                // Check for at least one lowercase letter
                if (!/[a-z]/.test(newPassword)) {
                    errors.push("Password must contain at least one lowercase letter.");
                }
                // Check for at least one uppercase letter
                if (!/[A-Z]/.test(newPassword)) {
                    errors.push("Password must contain at least one uppercase letter.");
                }
                // Check for at least one number
                if (!/\d/.test(newPassword)) {
                    errors.push("Password must contain at least one number.");
                }

                if (errors.length > 0) {
                    event.preventDefault(); // Stop form submission if there are client-side errors
                    errorMessageDiv.innerHTML = "<strong>Please fix the following:</strong><ul>" + errors.map(e => `<li>${e}</li>`).join('') + "</ul>";
                    errorMessageDiv.style.display = 'block';
                } else {
                    errorMessageDiv.style.display = 'none';
                    // Disable the button and change text to prevent multiple submissions
                    submitButton.disabled = true;
                    submitButton.textContent = 'Resetting...';
                }
            });
        });
    </script>
</body>
</html>
