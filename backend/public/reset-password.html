<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BusHubLK</title>
    <!-- Updated CSP to allow HTTP and form submissions -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action 'self' http: https:; connect-src 'self' http: https:;">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
        .requirements {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .requirements ul {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        .mobile-link {
            text-align: center;
            margin-top: 20px;
        }
        .mobile-button {
            background: #10b981;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚌 BusHubLK</h1>
            <h2>Reset Your Password</h2>
        </div>
        
        <div id="message"></div>
        
        <form id="resetForm">
            <div class="requirements">
                <strong>Password Requirements:</strong>
                <ul>
                    <li>At least 6 characters long</li>
                    <li>One uppercase letter</li>
                    <li>One lowercase letter</li>
                    <li>One number</li>
                </ul>
            </div>
            
            <input type="hidden" id="tokenInput" name="token" value="">
            
            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" name="newPassword" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" required minlength="6">
            </div>
            
            <button type="submit" id="submitBtn">Reset Password</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get token from URL path or query parameter
            const pathParts = window.location.pathname.split('/');
            const tokenFromPath = pathParts[pathParts.length - 1];
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromQuery = urlParams.get('token');
            
            const token = tokenFromQuery || (tokenFromPath !== 'reset-password.html' ? tokenFromPath : null);
            
            if (!token) {
                document.getElementById('message').innerHTML = 
                    '<div class="message error">Invalid reset link.</div>';
                document.getElementById('resetForm').style.display = 'none';
                return;
            }
            
            // Set the token in the hidden input
            document.getElementById('tokenInput').value = token;
            
            // Validate token on page load
            validateToken(token);
            
            document.getElementById('resetForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const submitBtn = document.getElementById('submitBtn');
                
                // Clear previous messages
                document.getElementById('message').innerHTML = '';
                
                // Validate password requirements
                if (newPassword.length < 6) {
                    document.getElementById('message').innerHTML = 
                        '<div class="message error">Password must be at least 6 characters long.</div>';
                    return;
                }
                
                if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(newPassword)) {
                    document.getElementById('message').innerHTML = 
                        '<div class="message error">Password must contain at least one uppercase letter, one lowercase letter, and one number.</div>';
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    document.getElementById('message').innerHTML = 
                        '<div class="message error">Passwords do not match.</div>';
                    return;
                }
                
                // Disable button and show loading
                submitBtn.disabled = true;
                submitBtn.textContent = 'Resetting...';
                
                try {
                    // Use the same protocol and host as the current page
                    const protocol = window.location.protocol;
                    const host = window.location.host;
                    const apiUrl = `${protocol}//${host}/api/password-reset/reset`;
                    
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            token: token,
                            newPassword: newPassword
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        document.getElementById('message').innerHTML = 
                            '<div class="message success">Password reset successfully! You can now login with your new password.</div>';
                        document.getElementById('resetForm').style.display = 'none';
                        
                        // Show mobile app link
                        document.getElementById('message').innerHTML += 
                            '<div class="mobile-link"><a href="bushublk://login" class="mobile-button">Open BusHubLK App</a></div>';
                        
                        // Optional: Redirect after 5 seconds
                        setTimeout(() => {
                            window.close(); // Try to close the tab
                        }, 5000);
                    } else {
                        document.getElementById('message').innerHTML = 
                            '<div class="message error">' + (data.error || 'Failed to reset password.') + '</div>';
                    }
                } catch (error) {
                    console.error('Reset error:', error);
                    document.getElementById('message').innerHTML = 
                        '<div class="message error">Network error. Please try again.</div>';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            });
        });

        async function validateToken(token) {
            try {
                const protocol = window.location.protocol;
                const host = window.location.host;
                const apiUrl = `${protocol}//${host}/api/password-reset/validate/${token}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (!data.success) {
                    document.getElementById('message').innerHTML = 
                        '<div class="message error">' + (data.error || 'Invalid or expired reset link.') + '</div>';
                    document.getElementById('resetForm').style.display = 'none';
                }
            } catch (error) {
                console.error('Token validation error:', error);
                document.getElementById('message').innerHTML = 
                    '<div class="message error">Failed to validate reset link.</div>';
                document.getElementById('resetForm').style.display = 'none';
            }
        }
    </script>
</body>
</html>
